<!-- 이 사이트는 처음부터 어두운 테마다. 선언이 없으면 휴대폰 브라우저의 강제 다크 모드가
     밝은 사이트로 보고 색을 다시 바꾼다. 그때 어두운 그래프(SVG)의 바탕이 밝아져 글자가 안 보였다. -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1a170f">

<!-- 글꼴 세 가지(2026-10-17 개편). 모두 SIL Open Font License 1.1이다.
     - 본문·글 제목: Pretendard. 화면에 나온 글자만 나눠 받는 판(dynamic subset)을 버전 고정으로 불러온다
     - 고정폭(메뉴·목차·절 제목·코드): 영문은 테마의 Fira Code, 한글은 Nanum Gothic Coding(Fira Code에 한글이 없다)
     - Noto Sans KR: Pretendard를 받지 못했을 때의 대체 글꼴 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap">

{{ with site.Params.verification.google }}<meta name="google-site-verification" content="{{ . }}">{{ end }}
{{ partial "schema.html" . }}
{{ with site.Params.verification.naver }}<meta name="naver-site-verification" content="{{ . }}">{{ end }}
