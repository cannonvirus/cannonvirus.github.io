name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 게시일이 미래인 글(주간 글은 주차 다음 월요일 09시)은 Hugo가 빌드에서 뺀다.
  # 푸시가 없어도 그날 공개되도록 매일 다시 빌드한다. 00:05 UTC = 09:05 KST.
  schedule:
    - cron: "5 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.pages.outputs.host }}
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Seoul
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      # 사이트 검색 색인. 설정은 pagefind.yml에 있다.
      - name: Search index
        run: npx -y pagefind@1.5.2
      # 글꼴. 빌드한 페이지(검색 화면 문구 포함)에 쓰인 글자만 남긴 CV Sans·CV Coding을 만든다(tools/subset_fonts.py).
      # static/fonts/site/에서 복사된 기준본을 덮어써, 새 글에 처음 나온 글자도 들어간다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Subset fonts
        run: |
          pip install --quiet fonttools==4.61.1 brotli==1.2.0
          python tools/subset_fonts.py public public/fonts/site
      # IndexNow로 알릴 주소. 지금 공개된 사이트맵과 새로 만든 사이트맵을 비교해 새로 생겼거나 수정일이 바뀐 주소만 고른다.
      # 예약 실행에서는 그날 공개된 글이 새 주소로 잡힌다. 바뀐 것이 없으면 []이고 indexnow 작업을 건너뛴다.
      - name: IndexNow targets
        id: indexnow
        run: |
          old="${{ runner.temp }}/old-sitemap.xml"
          curl -fsSL "${{ steps.pages.outputs.base_url }}/sitemap.xml" -o "$old" || : > "$old"
          python3 - "$old" public/sitemap.xml >> "$GITHUB_OUTPUT" <<'EOF'
          import json, re, sys
          def pairs(path):
              text = open(path, encoding="utf-8").read()
              return set(re.findall(r"<loc>([^<]+)</loc>\s*(?:<lastmod>([^<]+)</lastmod>)?", text))
          urls = sorted({loc for loc, _ in pairs(sys.argv[2]) - pairs(sys.argv[1])})
          print("urls=" + json.dumps(urls[:10000]))
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 새 글과 고친 글을 IndexNow(Bing·네이버 등)에 알린다. 구글은 IndexNow에 참여하지 않아 사이트맵으로 찾는다.
  # 배포가 끝난 뒤에 보내야 검색 엔진이 새 페이지를 읽을 수 있다. 키 파일은 static/<키>.txt이고, 키를 바꾸면 파일 이름·내용과
  # 아래 INDEXNOW_KEY를 함께 바꾼다. 응답 200·202가 정상이다(202는 키 확인 대기).
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow_urls != '' && needs.build.outputs.indexnow_urls != '[]'
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: f5856e35cb2bf76442bff4dcaadf9e2e
      HOST: ${{ needs.build.outputs.host }}
      URLS: ${{ needs.build.outputs.indexnow_urls }}
    steps:
      - name: Submit to IndexNow
        run: |
          echo "$URLS" | jq -r '.[]'
          jq -n --arg host "$HOST" --arg key "$INDEXNOW_KEY" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: $urls}' > body.json
          curl -sS --fail-with-body -w '\nHTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json
