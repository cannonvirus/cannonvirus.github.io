# 자체 도메인을 연결하면 baseURL만 바꾼다.
baseURL: https://cannonvirus.github.io/
locale: ko
defaultContentLanguage: ko
hasCJKLanguage: true
title: cannonvirus.log
theme: terminal

enableRobotsTXT: true
enableGitInfo: true # 글의 수정일(lastmod)을 마지막 커밋 날짜로 정한다. 사이트맵과 구조화 데이터(schema.html)가 쓴다. 배포 워크플로의 fetch-depth: 0이 필요하다.
capitalizeListTitles: false # 이름표 파일이 없는 태그를 머리말에 적힌 대로 보인다(vlm이 Vlm이 되지 않게).

# News 글은 모두 보고서형으로 보인다(2026-10-17 사용자 결정). 템플릿은 layouts/_default/report.html이다.
cascade:
  - target:
      path: "{/news/**}"
    layout: report

pagination:
  pagerSize: 10

# 글 끝 "관련 글"(related-posts.html)의 기준. 분야 태그가 겹치는 글을 고르고, 같으면 날짜가 가까운 글을 앞에 둔다.
# 같은 연재의 글은 연재 목록(series-nav.html)에 이미 있어 관련 글에서 뺀다.
related:
  includeNewer: true
  threshold: 80
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: date
      weight: 10

taxonomies:
  tag: tags # 분야. 글의 주제로 고른다. 이름표는 content/tags/<이름>/_index.md의 title이다.
  series: series # 연재. 개발일지의 프로젝트 묶음이다.

markup:
  goldmark:
    parser:
      attribute:
        block: true # 표 아래 {caption="..."}로 표 제목을 단다(render-table.html).
    extensions:
      strikethrough: false # 본문의 범위 표기(91.4~99.6%)가 취소선으로 바뀌지 않게 한다.
      extras:
        mark:
          enable: true # ==문장== 형광 강조
    renderer:
      unsafe: true # md 안의 HTML을 그대로 출력한다.
  highlight:
    noClasses: false # 테마의 구문 강조 색상에 필요하다.
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  contentTypeName: posts
  showMenuItems: 5 # 메뉴 5개(News·Projects·Tags·Search·GitHub)를 모두 펼쳐 둔다. 넘으면 "더 보기"로 접힌다.
  fullWidthTheme: false
  centerTheme: true
  autoCover: true
  readingTime: false
  Toc: true
  TocTitle: 목차
  dateFormat: "2006-01-02"

  # 서치 콘솔·서치어드바이저에서 발급받은 값을 넣는다. 비어 있으면 태그를 출력하지 않는다.
  verification:
    google: "MVsafGi0jkblN4BI8ft7iG-OLPuL6Lj08ZKTVycw21E"
    naver: ""

  # 방문 통계(GoatCounter). 가입할 때 정한 사이트 코드(https://<코드>.goatcounter.com의 <코드>)를 넣는다.
  # 비어 있으면 스크립트를 싣지 않는다. 로컬 미리보기(hugo server)에서는 싣지 않는다(analytics.html).
  goatcounter: ""

languages:
  ko:
    title: cannonvirus.log
    params:
      subtitle: 개발 기록과 기술 정리
      owner: cannonvirus
      ownerURL: https://github.com/cannonvirus # 구조화 데이터의 저자 주소
      keywords: ""
      copyright: ""
      menuMore: 더 보기
      readMore: 더 읽기
      readOtherPosts: 다른 글
      newerPosts: 최신 글
      olderPosts: 이전 글
      missingContentMessage: 페이지를 찾을 수 없습니다.
      missingBackButtonLabel: 첫 화면으로
      minuteReadingTime: 분
      words: 단어
      logo:
        logoText: "~/cannonvirus"
        logoHomeLink: /
    menu:
      main:
        - identifier: news
          name: News
          url: /news/
          weight: 10
        - identifier: projects
          name: Projects
          url: /projects/
          weight: 20
        - identifier: tags
          name: Tags
          url: /tags/
          weight: 30
        - identifier: search # 사이트 검색(Pagefind). content/search.md, layouts/_default/search.html
          name: Search
          url: /search/
          weight: 35
        - identifier: github
          name: GitHub
          url: https://github.com/cannonvirus
          weight: 40
