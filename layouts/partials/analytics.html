{{- /* 방문 통계(GoatCounter). hugo.yaml의 params.goatcounter에 사이트 코드가 있을 때만, 배포용 빌드에서만 싣는다.
       쿠키를 쓰지 않는다. 통계는 https://<코드>.goatcounter.com 에서 본다. */ -}}
{{ with site.Params.goatcounter }}{{ if hugo.IsProduction }}<script data-goatcounter="https://{{ . }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>{{ end }}{{ end }}
